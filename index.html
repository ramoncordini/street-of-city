<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cidade 2D Explorer</title>
    <link rel="stylesheet" href="./src/styles/game.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Cidade 2D Explorer">
      <div id="game-container"></div>

      <div class="game-topbar" aria-label="Controles">
        <strong>Cidade 2D Explorer</strong>
        <span>Setas: mover</span>
        <span>Porta: interagir</span>
        <span>Espaco: cumprimentar/fechar</span>
      </div>

      <div class="mobile-controls" aria-label="Controles mobile">
        <div class="mobile-pad" aria-label="Movimento">
          <button class="pad-button pad-up" type="button" data-direction="up" aria-label="Mover para cima">▲</button>
          <button class="pad-button pad-left" type="button" data-direction="left" aria-label="Mover para esquerda">◀</button>
          <button class="pad-button pad-right" type="button" data-direction="right" aria-label="Mover para direita">▶</button>
          <button class="pad-button pad-down" type="button" data-direction="down" aria-label="Mover para baixo">▼</button>
        </div>
        <button id="mobile-action" class="mobile-action" type="button" aria-label="Cumprimentar">A</button>
      </div>

      <div class="rotate-device" aria-label="Gire o dispositivo">
        <strong>Gire o celular</strong>
        <span>Use o jogo em tela deitada para jogar melhor.</span>
      </div>
    </main>

    <section id="character-screen" class="character-screen" aria-label="Criacao de personagem">
      <form id="character-form" class="character-card">
        <h2>Crie seu personagem</h2>
        <label for="player-name">Nome</label>
        <input id="player-name" type="text" name="playerName" maxlength="16" autocomplete="off" placeholder="Seu nome" required />

        <p>Sexo</p>
        <div class="choice-row" role="radiogroup" aria-label="Sexo do personagem">
          <label>
            <input type="radio" name="playerGender" value="male" checked />
            <span>Masculino</span>
          </label>
          <label>
            <input type="radio" name="playerGender" value="female" />
            <span>Feminino</span>
          </label>
        </div>

        <p>Cor</p>
        <div class="color-grid" role="radiogroup" aria-label="Cor do personagem">
          <label>
            <input type="radio" name="playerColor" value="0x3a86ff" checked />
            <span style="--swatch: #3a86ff"></span>
          </label>
          <label>
            <input type="radio" name="playerColor" value="0xe76f51" />
            <span style="--swatch: #e76f51"></span>
          </label>
          <label>
            <input type="radio" name="playerColor" value="0x2a9d8f" />
            <span style="--swatch: #2a9d8f"></span>
          </label>
          <label>
            <input type="radio" name="playerColor" value="0x9c89b8" />
            <span style="--swatch: #9c89b8"></span>
          </label>
        </div>

        <button type="submit">Entrar na cidade</button>
      </form>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
